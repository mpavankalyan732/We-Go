# Render Blueprint for RoadLink's Bus API (bus-booking-app/api) and website
# (bus-booking-app/web). In the Render dashboard: New > Blueprint > select
# this repo. Render will detect this file and propose both services below.
#
# Env vars marked `sync: false` are secrets/config Render will prompt you to
# fill in per-environment rather than committing real values here - see
# bus-booking-app/api/README.md "Salesforce sync" and "Deploying to Render"
# for what each one does.
services:
  - type: web
    name: roadlink-bus-api
    runtime: node
    plan: free
    rootDir: bus-booking-app/api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.9.0
      - key: API_KEY
        sync: false
      - key: DB_PATH
        sync: false
      - key: SF_CLIENT_ID
        sync: false
      - key: SF_CLIENT_SECRET
        sync: false
      - key: SF_LOGIN_URL
        sync: false

  - type: web
    name: roadlink-bus-web
    runtime: static
    rootDir: bus-booking-app/web
    # rm -rf node_modules first: works around a known npm optional-dependency
    # bug (npm/cli#4828) where Render's own pre-install step can leave the
    # platform-specific native binary (here, @rolldown/binding-linux-x64-gnu,
    # a transitive dep of vite) missing even though the lockfile lists it -
    # a plain `npm install` then sees "up to date" and skips re-verifying it.
    buildCommand: rm -rf node_modules ../node_modules && npm install --workspaces=false && npm run build
    staticPublishPath: dist
    envVars:
      # Set this to the roadlink-bus-api service's public URL once it's live
      # (e.g. https://roadlink-bus-api.onrender.com), so the built website
      # calls the deployed API instead of localhost:4000.
      - key: VITE_API_BASE_URL
        sync: false
      # Only needed if roadlink-bus-api's API_KEY is set (auth enabled) -
      # must match it exactly. Gets bundled into the built site's JS, so it's
      # visible to anyone via devtools once deployed - not a real secret at
      # that point, just a gate against casual anonymous scraping.
      - key: VITE_API_KEY
        sync: false
